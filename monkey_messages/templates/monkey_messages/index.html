{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monkey Messenger</title>

    <link rel="shortcut icon" href="{% static 'favicon.ico' %}">
    <style>
        :root {

            --bg-color: #22272d;
            --card-bg: #22272d;
            --btn-color: #1d2127;
            --primary-hover: #2e333a;
            --text-color: #a9b665;
            --text-muted: #8d9855;
            --border: #373e47;
            --header-color: #d4be98;
            --label-color: #c49852;
        }

        body {
            font-family: "Cascadia Code", Consolas, "Courier New", monospace;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            height: 95vh;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            height:100%;
            /* max-width: 500px; */
            display: flex;
            flex-direction: row;
            gap: 20px;
            align-items: stretch;
        }

        .card {
            flex: 1;
            background: var(--card-bg);
            padding: 24px;
            /* border-radius: 2px; */
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            min-height: 0;
            overflow: hidden;
        }

        h2 {
            margin-top: 0;
            margin-bottom: 16px;
            font-size: 1.25rem;
            color: var(--header-color);
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 6px;
            font-size: 0.875rem;
            color: var(--label-color);
        }

        input[type="password"],
        textarea {
            width: 100%;
            padding: 10px;
            border: 0.5px solid var(--border);
            /* border-radius:2px; */
            box-sizing: border-box;
            font-size: 1rem;
            margin-bottom: 12px;
            background-color: var(--bg-color);
            color: var(--text-color);
            flex: none;
            resize: none;
        }

        textarea {
            height: 110px;
            resize: vertical;
        }

        .meta-bar {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 12px;
        }

        button {
            width: 100%;
            background-color: var(--btn-color);
            color: var(--text-color);
            border: none;
            padding: 12px;
            /* border-radius: 2px; */
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        #status {
            margin-top: 10px;
            font-size: 0.875rem;
            font-weight: 500;
        }

        .history-list {
            list-style: none;
            padding: 0;
            margin: 0;
            flex: 1;
            overflow-y: auto;
            min-height: 0;
            padding-right: 6px;
        }

        .history-item {
            padding: 10px;
            border-bottom: 1px solid var(--border);
        }

        .history-item:last-child {
            border-bottom: none;
        }

        .history-date {
            font-size: 0.75rem;
            color: var(--text-muted);
            word-break: break-word;
            overflow-wrap: break-word;
        }

        .history-list::-webkit-scrollbar {
            width: 6px;
        }

        .history-list::-webkit-scrollbar-track {
            background: var(--bg-color);
        }

        .history-list::-webkit-scrollbar-thumb {
            background: var(--border);
            /* border-radius: 2px; */
        }

        .history-list::-webkit-scrollbar-thumb:hover {
            background: var(--text-muted);
        }
        /* Responsive design for mobile screens */
        @media (max-width: 768px) {
            .container {
                flex-direction: column-reverse; /* Stacks messenger on top for mobile */
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <!-- Left Column: Past Messages -->
        <div class="card">
            <h2>Recent Messages</h2>
            <ul id="historyList" class="history-list">
                <li class="history-item">Loading history...</li>
            </ul>
        </div>
    
        <!-- Right Column: Messenger -->
        <div class="card">
            <h2>Send Monkey a Message</h2>
    
            <label for="apiKey">API Key</label>
            <input type="password" id="apiKey" placeholder="Enter X-API-Key" onchange="saveApiKey()">
    
            <label for="messageText">Message</label>
            <textarea id="messageText" maxlength="1000" placeholder="Type your note here..."
                oninput="updateCounter()"></textarea>
    
            <div class="meta-bar">
                <span id="charCounter">0 / 1000</span>
            </div>
    
            <button onclick="sendMessage()">Send to ESP32</button>
            <div id="status"></div>
        </div>
    </div>

    <script>
    document.addEventListener("DOMContentLoaded", () => {
        const savedKey = localStorage.getItem("monkey_api_key");
        if (savedKey) {
            document.getElementById("apiKey").value = savedKey;
            loadHistory();
        }
    });

    function saveApiKey() {
        const key = document.getElementById("apiKey").value.trim();
        localStorage.setItem("monkey_api_key", key);
        loadHistory();
    }

    function updateCounter() {
        const text = document.getElementById("messageText").value;
        document.getElementById("charCounter").innerText = `${text.length} / 1000`;
    }

    async function sendMessage() {
        const apiKey = document.getElementById("apiKey").value.trim();
        const text = document.getElementById("messageText").value.trim();
        const statusEl = document.getElementById("status");

        if (!apiKey) {
            statusEl.innerText = "Error: API key required.";
            statusEl.style.color = "#e96963";
            return;
        }

        if (!text) {
            statusEl.innerText = "Error: Message cannot be empty.";
            statusEl.style.color = "#e96963";
            return;
        }

        try {
            const response = await fetch("/api/monkey_messages/", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "X-API-Key": apiKey
                },
                body: JSON.stringify({ text: text })
            });

            const data = await response.json();

            if (response.ok) {
                statusEl.innerText = "Message sent successfully!";
                statusEl.style.color = "#c668c4";
                document.getElementById("messageText").value = "";
                updateCounter();
                loadHistory();
            } else {
                statusEl.innerText = `Error: ${data.error || 'Failed to send'}`;
                statusEl.style.color = "#e96963";
            }
        } catch (err) {
            statusEl.innerText = "Network error occurred.";
            statusEl.style.color = "#e96963";
        }
    }

    async function loadHistory() {
        const apiKey = document.getElementById("apiKey").value.trim();
        const historyList = document.getElementById("historyList");

        if (!apiKey) {
            historyList.innerHTML = '<li class="history-item">Enter API Key to load history.</li>';
            return;
        }

        try {
            const response = await fetch("/api/monkey_messages/history/", {
                headers: { "X-API-Key": apiKey }
            });

            if (!response.ok) {
                historyList.innerHTML = '<li class="history-item">Failed to load history. Check API Key.</li>';
                return;
            }

            const data = await response.json();
            historyList.innerHTML = "";

            if (!data.messages || data.messages.length === 0) {
                historyList.innerHTML = '<li class="history-item">No messages sent yet.</li>';
                return;
            }

            data.messages.forEach(msg => {
                const li = document.createElement("li");
                li.className = "history-item";
                const date = new Date(msg.created_at).toLocaleString();
                li.innerHTML = `<div>${msg.text}</div><div class="history-date">${date}</div>`;
                historyList.appendChild(li);
            });
        } catch (err) {
            historyList.innerHTML = '<li class="history-item">Error fetching history.</li>';
        }
    }
    </script>
</body>

</html>
