{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monkey Messenger</title>

    <link rel="shortcut icon" href="{% static 'favicon.ico' %}">
    <link rel="stylesheet" href="{% static './css/mm.css' %}">
</head>

<body>

    <div class="container">
        <!-- past messages on left card -->
        <div class="card">
            <h2>Recent Messages</h2>
            <ul id="historyList" class="history-list">
                <li class="history-item">Enter API key to load history</li>
            </ul>
        </div>
    
        <!-- messenger on right card -->
        <div class="card">
            <h2>Send Monkey a Message</h2>
    
            <label for="apiKey">API Key</label>
            <input type="password" id="apiKey" placeholder="Enter X-API-Key" onchange="saveApiKey()">
    
            <label for="messageText">Message</label>
            <textarea id="messageText" maxlength="1000" placeholder="What do you wanna tell Monkey..."
                oninput="updateCounter()"></textarea>
    
            <div class="meta-bar">
                <span id="charCounter">0 / 1000</span>
            </div>

            <label for="imageInput"> Pic? </label>
            <input type="file" id="imageInput" accept="image/*">

            <button id="sendBtn" onclick="sendMessage()">Send to ESP32</button>
            <div id="status"></div>
        </div>
    </div>

    <!-- Image Preview Modal -->
    <div id="imageModal" class="modal-overlay" onclick="closeModal(event)">
        <span class="modal-close" onclick="closeModal(event)">&times;</span>
        <img class="modal-image" id="modalImage" src="" alt="Enlarged view">
    </div>

    <script src="{% static './js/mm.js' %}"></script>
</body>

</html>
